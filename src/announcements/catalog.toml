# Maintainer catalog for `src/announcements.rs`. Append with the next id; ids
# increase and are never reused. Changelog URLs go in `notes`, never in `title`.
# A comment-only file means this release has nothing to announce.
#
# id 1 ("Guides and release notes on your desk") was retired before it shipped, so the
# starter tour is the only thing a 0.7.x upgrader sees. The next entry is id 2.

[[announcement]]
id = 2
title = "An inbox, a projects preview, and tsk help"
notes = "New captures start in an open inbox below ON DECK. Pick work with ctrl+n, send it back with ctrl+o, and use tsk list --open or --ready to filter from the CLI.\n\nOn a wide terminal the projects tab previews the cursored project beside the list; press → to work in it. The projects index counts ON DECK and DONE.\n\ntsk --help is the CLI reference: tsk help <command> explains one command, tsk --version prints the version.\n\nAsk your agent to refine a task: \"refine T12\" or \"what is missing from T12\". It reads the task and the code, asks one question at a time, and proposes a rewrite before it edits, so the task is ready for an agent to pick up. Rerun tsk setup to update the skill.\n\nChangelog: https://github.com/smarzban/herdr-tsk/blob/main/CHANGELOG.md"
