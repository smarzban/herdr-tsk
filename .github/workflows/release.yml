name: Prepare release

# Owner-run only. No tag/push trigger and no public publishing or tap credentials.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching Cargo.toml (for example v0.5.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Validate tag syntax
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test, build and package the tagged source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py check-version "$TAG"
          python3 -m unittest discover -s tests/packaging
          if [ "$RUNNER_OS" = Linux ]; then export RUSTFLAGS='-C linker=musl-gcc'; fi
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
          "target/$TARGET/release/tsk" --help
          TSK_TEST_BINARY="$PWD/target/$TARGET/release/tsk" python3 -m unittest discover -s tests/packaging
          python3 scripts/release.py package "$TAG" "$TARGET" "target/$TARGET/release/tsk" dist-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist-release/*.tar.gz
          if-no-files-found: error

  draft:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*-*
          path: dist-release
          merge-multiple: true
      - name: Generate checksums and version-pinned tap formula
        run: python3 scripts/release.py assemble "$TAG" dist-release
      - name: Validate generated Ruby
        run: ruby -c dist-release/tsk.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: dist-release/*
          if-no-files-found: error
      - name: Refuse a moved tag
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)" = "$RELEASE_COMMIT"
      - name: Create draft only (refuses an existing release)
        run: gh release create "$TAG" dist-release/* --verify-tag --draft --title "tsk $TAG" --notes-file packaging/RELEASE-NOTES.md
