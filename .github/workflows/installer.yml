name: Installer

on:
  push:
    branches: [main]
    paths:
      - "site/public/install.sh"
      - "scripts/release.py"
      - "tests/packaging/**"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Packaging contract tests
        run: python3 -m unittest discover -s tests/packaging
      - name: Shellcheck installer
        run: shellcheck site/public/install.sh
