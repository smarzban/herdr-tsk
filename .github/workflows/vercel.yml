name: Vercel

# Deploys are driven here, not by Vercel's Git integration, so only
# changes under site/ ever reach Vercel.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/vercel.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@58

      - name: Deploy
        id: deploy
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_eErh7AfvdjecAyy2gaZkY76Q
          VERCEL_PROJECT_ID: prj_CNHAMn4BHWAvMCIasGuOhVHu9jZy
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            vercel deploy --prod --yes --token "$VERCEL_TOKEN" > deploy.log 2>&1
          else
            vercel deploy --yes --token "$VERCEL_TOKEN" > deploy.log 2>&1
          fi
          cat deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nPreview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
