name: Demo parity
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/fixtures/demo-parity/**"
      - "tests/demo_parity.rs"
      - "site/public/**"
      - "site/parity/**"
      - "site/astro.config.mjs"
      - "site/src/components/**"
      - "scripts/parity-pty-smoke.py"
      - "scripts/parity-requirements.txt"
      - "site/src/pages/index.astro"
      - "site/src/styles/landing.css"
      - "site/package*.json"
      - "site/playwright.config.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/parity.yml"
permissions:
  contents: read
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/parity-requirements.txt
      - run: python -m pip install -r ../scripts/parity-requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:parity
      - name: Release-binary PTY smoke
        run: python ../scripts/parity-pty-smoke.py
